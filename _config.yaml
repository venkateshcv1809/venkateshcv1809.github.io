url: "https://venkateshcv1809.github.io"
baseurl: ""

markdown: kramdown
kramdown:
  syntax_highlighter: rouge

sass:
    style: compressed
    sourcemap: development
    quiet_deps: true

collections:
    pages:
        output: true
        permalink: /:name
        is_structural: true

exclude:
    - Gemfile
    - Gemfile.lock
    - .jekyll-cache
    - .justfile
    - justfile
    - mise.lock
    - mise.toml
    - README.md

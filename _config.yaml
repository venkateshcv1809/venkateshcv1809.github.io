url: "https://venkateshcv1809.github.io"
baseurl: ""

# Markdown renderer
markdown: kramdown
kramdown:
    input: GFM
    syntax_highlighter: rouge
    smart_quotes: lsquo,rsquo,ldquo,rdquo
    hard_wrap: false
    auto_ids: true
    footnote_nr: 1

sass:
    style: compressed
    sourcemap: development
    quiet_deps: true

collections:
    pages:
        output: true
        permalink: /:name
        is_structural: true

exclude:
    - Gemfile
    - Gemfile.lock
    - README.md
    - .jekyll-cache
    - .bundle
    - vendor
    - _site
    - justfile
    - .justfile
    - mise.toml
    - mise.lock

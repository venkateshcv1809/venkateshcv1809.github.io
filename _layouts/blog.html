---
layout: default
---
<article class="blog">

    <header class="blog-header">

        <h1>{{ page.title }}</h1>

        {% if page.description %}
            <p class="blog-description">
                {{ page.description }}
            </p>
        {% endif %}

    </header>

    <section class="blog-content">

        {{ content }}

    </section>

</article>

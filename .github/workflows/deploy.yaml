name: Deploy Personal Website

on:
  push:
    branches:
      - develop

# Grant permissions to configure GitHub Pages directly
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs in progress
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.5'
          bundler-cache: true

      - name: Setup Pages Configuration
        uses: actions/configure-pages@v5

      - name: Compile Static Site Files
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload Production Artifact
        uses: actions/upload-pages-artifact@v3

      - name: Direct Deploy to GitHub Pages Live Server
        id: deployment
        uses: actions/deploy-pages@v4
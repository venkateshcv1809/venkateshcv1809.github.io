{% assign current_url = page.url | replace: "index.html", "" %}

<header class="tmux-status">
    <nav class="tmux-status-nav" aria-label="Primary navigation">

        <div class="tmux-status-windows">
            {% for item in navigation.header %}
                {% assign nav_url = item.url | relative_url %}
                {% assign nav_url = nav_url | replace: "index.html", "" %}
                <a
                    href="{{ nav_url }}"
                    class="tmux-window{% if current_url == nav_url %} is-active{% endif %}"
                    {% if current_url == nav_url %}aria-current="page"{% endif %}
                >
                    <span class="tmux-window-icon">
                        :icon-{{ item.icon }}:
                    </span>

                    <span class="tmux-window-title">
                        {{ item.title }}
                    </span>
                </a>
            {% endfor %}
        </div>

    </nav>
</header>
